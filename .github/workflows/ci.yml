name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      # 型別由 openapi/openapi.json 產生；不一致代表有人手改 generated/ 或更新 spec 後忘了重新產生
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code src/types/generated
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5037/api
